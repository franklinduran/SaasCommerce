sonar.projectKey=comercioflow-saas
sonar.projectName=ComercioFlow SaaS Platform
sonar.projectVersion=1.0.0
sonar.sources=frontend/src,backend/src
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/.next/**,**/dist/**
sonar.sourceEncoding=UTF-8

# Frontend Configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Backend Configuration (C#)
sonar.cs.opencover.reportsPaths=backend/**/coverage.opencover.xml
sonar.cs.fxcop.reportPath=backend/**/FxCopResults.xml

# Subscription Module Analysis
sonar.inclusions=**/Modules/Billing/**,**/modules/subscription/**

# Exclude test files from metrics
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.cs,**/*Tests.cs

# SonarQube Server
sonar.host.url=http://localhost:9000

# Analysis Settings
sonar.analysis.mode=publish
sonar.qualitygate.wait=true
