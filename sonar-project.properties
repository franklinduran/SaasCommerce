sonar.projectKey=comercioflow-saas
sonar.projectName=ComercioFlow SaaS Platform
sonar.projectVersion=1.0.0
sonar.sources=frontend/src,backend/src
sonar.sourceEncoding=UTF-8

# Exclude build artifacts and test files from metrics
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/.next/**,**/dist/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.cs,**/*Tests.cs

# Frontend Configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Backend Configuration (C#)
sonar.cs.opencover.reportsPaths=backend/**/coverage.opencover.xml

# Module Focus: Billing, Notifications, Identity/Auth + Security (Etapas 23, 28, 29)
sonar.inclusions=**/Modules/Billing/**,**/Modules/Notifications/**,**/Modules/Identity/Application/Auth/**,**/Api/Middleware/**,**/modules/subscription/**,**/modules/notifications/**,**/modules/auth/**,**/shared/services/httpClient.ts

# SonarQube Server
sonar.host.url=http://localhost:9000
